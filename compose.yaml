services:
  db:
    image: postgres:19
    environment:
      POSTGRES_USER: ${POSTGRES__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build:
      context: .
      dockerfile: ./src/GameBackendAPI/Dockerfile
    environment:
      POSTGRES__USERNAME: ${POSTGRES__USERNAME}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES__DATABASE: ${POSTGRES__DATABASE} 
      AUTH__KEY: ${AUTH__SECRET_KEY}
      POSTGRES__HOST: db
      POSTGRES__PORT: 5432
      REDIS__HOST: redis
      REDIS__PORT: 6379
    ports:
      - "8080:8080"
    depends_on: 
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:8.8.4
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes: 
  db_data:
  redis_data: